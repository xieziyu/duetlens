# 官网(site/)发到 GitHub Pages。
#
# 只留手动触发:官网不是发版链路的一环,不该被每次 push 拖着跑;要发就自己点一下。
# 首次使用前需在仓库 Settings → Pages 把 Source 设为 "GitHub Actions",否则 deploy 步骤会报 404。
#
# 站点部署在 https://<owner>.github.io/duetlens/,base 路径写在 vite.site.config.ts;
# 换自定义域名时要同时改那里的 base,并在 site/ 下加 CNAME。
name: pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一个部署;排队而不是取消,避免把已发出去的站点留在半路状态
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      # 官网只用到 vite;跳过 postinstall 的原生模块重编(better-sqlite3 与这里无关)
      - run: npm ci --ignore-scripts

      - run: npm run site:build

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site/dist

      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
